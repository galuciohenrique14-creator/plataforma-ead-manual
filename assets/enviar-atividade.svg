<svg xmlns="http://www.w3.org/2000/svg" width="720" height="480" viewBox="0 0 720 480" role="img" aria-labelledby="title desc"><title id="title">Ilustração didática: envio de atividade</title><desc id="desc">Três passos ilustrados: localizar tarefa, anexar arquivo e confirmar envio.</desc><rect width="720" height="480" rx="26" fill="#edf3fa"/><rect x="32" y="26" width="656" height="428" rx="20" fill="#fff" stroke="#d7e1ed" stroke-width="2"/><text x="64" y="83" font-family="Arial" font-size="21" font-weight="700" fill="#17283e">Entrega de atividade</text><text x="64" y="109" font-family="Arial" font-size="13" fill="#52657b">Siga as etapas e confira o envio antes de sair da página.</text><rect x="64" y="137" width="592" height="76" rx="13" fill="#f5f8fc" stroke="#dce5ef"/><circle cx="101" cy="175" r="20" fill="#eaf2ff"/><text x="96" y="181" font-family="Arial" font-size="16" font-weight="700" fill="#175cd3">1</text><text x="137" y="170" font-family="Arial" font-size="15" font-weight="700" fill="#17283e">Localize a tarefa</text><text x="137" y="191" font-family="Arial" font-size="12" fill="#52657b">Abra a disciplina e confira o prazo.</text><rect x="64" y="228" width="592" height="95" rx="13" fill="#f5f8fc" stroke="#dce5ef"/><circle cx="101" cy="275" r="20" fill="#eaf2ff"/><text x="96" y="281" font-family="Arial" font-size="16" font-weight="700" fill="#175cd3">2</text><text x="137" y="263" font-family="Arial" font-size="15" font-weight="700" fill="#17283e">Anexe o arquivo</text><rect x="137" y="274" width="407" height="32" rx="7" fill="#fff" stroke="#9db5d3" stroke-dasharray="5 4"/><rect x="149" y="281" width="22" height="19" rx="3" fill="#ffeded"/><text x="152" y="294" font-family="Arial" font-size="8" font-weight="700" fill="#b42318">PDF</text><text x="182" y="295" font-family="Arial" font-size="11" fill="#52657b">atividade-final.pdf</text><path d="m517 283 8 8 14-15" fill="none" stroke="#16834d" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><rect x="64" y="338" width="592" height="78" rx="13" fill="#eaf9f1" stroke="#b9e3ca"/><circle cx="101" cy="377" r="20" fill="#d3f0de"/><text x="96" y="383" font-family="Arial" font-size="16" font-weight="700" fill="#157347">3</text><text x="137" y="372" font-family="Arial" font-size="15" font-weight="700" fill="#17283e">Confirme o envio final</text><text x="137" y="393" font-family="Arial" font-size="12" fill="#52657b">Salve e verifique a mensagem de confirmação.</text><rect x="532" y="363" width="99" height="31" rx="8" fill="#16834d"/><text x="548" y="383" font-family="Arial" font-size="11" font-weight="700" fill="#fff">Enviar tarefa</text></svg>
