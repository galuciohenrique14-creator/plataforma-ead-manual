<svg xmlns="http://www.w3.org/2000/svg" width="720" height="480" viewBox="0 0 720 480" role="img" aria-labelledby="t d"><title id="t">Exemplo ilustrativo de busca por plataforma EaD</title><desc id="d">Resultado de pesquisa demonstrativo, identificado como anúncio, sem endereço oficial.</desc><rect width="720" height="480" rx="25" fill="#eef3f9"/><rect x="28" y="24" width="664" height="432" rx="20" fill="#fff" stroke="#d7e1ed" stroke-width="2"/><rect x="28" y="24" width="664" height="48" rx="20" fill="#f7f9fc"/><circle cx="54" cy="48" r="6" fill="#ed827b"/><circle cx="75" cy="48" r="6" fill="#eac15e"/><circle cx="96" cy="48" r="6" fill="#60b987"/><rect x="126" y="37" width="485" height="23" rx="11" fill="#e9eef5"/><text x="146" y="53" font-family="Arial" font-size="12" fill="#64748b">mecanismo de busca • exemplo visual</text><rect x="72" y="99" width="570" height="46" rx="23" fill="#fff" stroke="#cbd7e5" stroke-width="2"/><circle cx="98" cy="121" r="9" fill="none" stroke="#64748b" stroke-width="2.5"/><path d="m105 128 7 7" stroke="#64748b" stroke-width="2.5" stroke-linecap="round"/><text x="130" y="127" font-family="Arial" font-size="15" fill="#34445a">plataforma EaD da minha instituição</text><text x="76" y="175" font-family="Arial" font-size="12" fill="#64748b">Resultados de exemplo</text><rect x="72" y="190" width="570" height="180" rx="14" fill="#fff" stroke="#cbd7e5" stroke-width="2"/><rect x="91" y="208" width="70" height="23" rx="6" fill="#fff3d8"/><text x="101" y="224" font-family="Arial" font-size="12" font-weight="700" fill="#805311">ANÚNCIO</text><text x="91" y="259" font-family="Arial" font-size="21" font-weight="700" fill="#175cd3">Exemplo de resultado patrocinado</text><text x="91" y="286" font-family="Arial" font-size="14" fill="#28734c">endereço demonstrativo • não oficial</text><text x="91" y="318" font-family="Arial" font-size="14" fill="#52657b">Esta imagem é uma ilustração e não representa o portal</text><text x="91" y="340" font-family="Arial" font-size="14" fill="#52657b">de nenhuma instituição ou serviço real.</text><rect x="72" y="389" width="570" height="42" rx="11" fill="#fff6e8"/><circle cx="94" cy="410" r="10" fill="#8a4b08"/><text x="91" y="414" font-family="Arial" font-size="13" font-weight="700" fill="#fff">!</text><text x="114" y="415" font-family="Arial" font-size="13" font-weight="700" fill="#70410b">Confirme o endereço oficial com a sua instituição.</text></svg>
